name: Build Sultan Kernel Pixel 9 Pro XL

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CODENAME: "caimito"
      REPO_URL: "https://github.com/kerneltoast/android_kernel_google_tensynos"
      BRANCH: "16.0.0-sultan"
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384 # Increased reserve
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo python3 git curl bc bison flex libssl-dev make zip
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.email "bot@example.com"
          git config --global user.name "Sultan-Builder"

      - name: Sync Sultan Kernel Source
        run: |
          mkdir kernel && cd kernel
          repo init -u ${{ env.REPO_URL }} -b ${{ env.BRANCH }} --depth=1
          # Optimization: Sync only what is needed, avoid hanging on large modules
          repo sync -c -j4 --fail-fast --force-sync --no-tags --no-clone-bundle

      - name: Setup AnyKernel3 & SuSFS
        run: |
          git clone https://github.com/simonpunk/susfs4ksu -b gki-android14-6.1
          git clone https://github.com/TheWildJames/AnyKernel3 -b sultan-gs201

      - name: Integrate SukiSU-Ultra
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      - name: Apply SuSFS Patches
        run: |
          cd kernel
          # 1. Patch SukiSU-Ultra for SuSFS
          cd KernelSU
          patch -p1 < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          
          # 2. Patch Common Kernel tree
          cd ../common
          patch -p1 < ../../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-6.1.patch
          cp ../../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          
          # 3. Fix ABI mismatch for Android 16
          rm -f android/abi_gki_protected_exports_aarch64

      - name: Configure Defconfig
        run: |
          DEFCONFIG="kernel/private/devices/google/caimito/caimito_defconfig"
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
          } >> $DEFCONFIG

      - name: Build with Kleaf (Bazel)
        run: |
          cd kernel
          # LTO=thin + Reduced job count to prevent OOM hang
          LTO=thin BUILD_AOSP_KERNEL=1 ./build_caimito.sh

      - name: Package AnyKernel3
        run: |
          cp kernel/out/caimito/dist/init_boot.img AnyKernel3/
          cd AnyKernel3
          zip -r ../Sultan-A16-Komodo-SukiSU-SuSFS.zip ./*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Sultan A16 SukiSU-SuSFS Build #${{ github.run_number }}"
          body: |
            ### Sultan Kernel for Pixel 9 Pro XL
            - **Android Version:** 16 (Sultan Branch)
            - **Root:** SukiSU-Ultra
            - **Bypass:** SuSFS v2.0.0
            - **Flash:** Flash via KernelFlasher or Fastboot
          files: Sultan-A16-Komodo-SukiSU-SuSFS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
