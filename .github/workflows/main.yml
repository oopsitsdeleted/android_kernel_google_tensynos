name: Build Sultan Kernel (Pixel 9 Pro XL)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm git curl

      - name: Setup Kernel Source
        run: |
          # Use the correct branch for Sultan's Pixel 9 series
          git clone --depth=1 https://github.com/kerneltoast/android_kernel_google_tensynos.git -b 16.0.0-sultan kernel-src
          echo "KERNEL_ROOT=$(pwd)/kernel-src" >> $GITHUB_ENV

      - name: Integrate SukiSU-Ultra & SusFS
        run: |
          cd kernel-src
          # 1. Integrate SukiSU-Ultra via automated script
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          
          # 2. Clone SusFS patches repository
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 susfs-repo
          
          # 3. Copy SusFS core files to kernel tree
          cp susfs-repo/kernel_patches/fs/susfs.c fs/
          cp susfs-repo/kernel_patches/include/linux/susfs.h include/linux/
          
          # 4. Apply SusFS Enable patch to KernelSU directory
          cp susfs-repo/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
          
          # 5. Apply Main Kernel SusFS patch (Targeting GKI 6.1)
          # Sultan's kernel is highly customized; if this fails, you must patch manually.
          patch -p1 < susfs-repo/kernel_patches/50_add_susfs_in_kernel-6.1.patch || echo "Patch failed, likely due to Sultan's custom code. Check for .rej files."

      - name: Configure and Build
        run: |
          cd kernel-src
          # Inject SukiSU/SusFS configs into the GKI defconfig
          # For Pixel 9, we target the arm64 GKI config
          cat <<EOF >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_SUSFS_SUS_PATH=y
          CONFIG_SUSFS_SUS_MOUNT=y
          CONFIG_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          EOF
          
          # Build using Sultan's preferred Clang/LLVM
          make O=out ARCH=arm64 gki_defconfig
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pixel9-SukiSU-SusFS
          path: kernel-src/out/arch/arm64/boot/Image
