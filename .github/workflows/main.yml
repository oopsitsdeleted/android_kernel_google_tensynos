name: Build Sultan Kernel with SukiSU & SusFS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm

      - name: Setup Kernel Source
        run: |
          git clone --depth=1 https://github.com/kerneltoast/android_kernel_google_tensynos.git -b 14-15.0.0 kernel-src
          echo "KERNEL_ROOT=$(pwd)/kernel-src" >> $GITHUB_ENV

      - name: Integrate SukiSU-Ultra & SusFS
        run: |
          cd kernel-src
          # Automated setup for SukiSU with SusFS branch
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          
          # Clone SusFS for patches (adjust version as needed for Sultan's kernel, likely 6.1)
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 susfs
          
          # Apply SusFS Patches
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cp susfs/kernel_patches/fs/susfs.c fs/
          cp susfs/kernel_patches/include/linux/susfs.h include/linux/
          
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch
          cd ..
          
          # Sultan's kernel is likely 6.1. Use the appropriate versioned patch.
          # If patch fails due to Sultan's custom code, you'll need to patch manually and host the .patch file.
          patch -p1 < susfs/kernel_patches/50_add_susfs_in_kernel-6.1.patch || true

      - name: Configure and Build
        run: |
          cd kernel-src
          # Enable necessary configs
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_SUSFS_SUS_PATH=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          
          # GKI Build command (Standard GKI tools usually required, here using simplified make)
          # Note: Pixel 9 build usually requires the 'build.sh' from AOSP, but Sultan's source allows standalone make.
          make O=out ARCH=arm64 gki_defconfig
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-SukiSU-SusFS-Kernel
          path: kernel-src/out/arch/arm64/boot/Image
