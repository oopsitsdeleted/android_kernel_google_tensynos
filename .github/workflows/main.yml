name: Build Sultan Kernel & Pack init_boot
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm git curl gcc-aarch64-linux-gnu cpio

      - name: Checkout Your Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate SukiSU-Ultra & SusFS
        run: |
          # 1. Setup SukiSU-Ultra (Manual Integration to avoid script conflicts)
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
          # Move the KernelSU source to the root where Sultan's build expects it
          cp -r SukiSU-Ultra/kernel KernelSU
          
          # 2. Setup SusFS
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 susfs_repo
          
          # 3. Copy SusFS Core Files
          cp susfs_repo/kernel_patches/fs/susfs.c fs/
          cp susfs_repo/kernel_patches/include/linux/susfs.h include/linux/
          
          # 4. FIX: The "ksu_susfs.h" problem
          # SukiSU-Ultra core looks for ksu_susfs.h in its own folder
          cp susfs_repo/kernel_patches/include/linux/susfs.h KernelSU/ksu_susfs.h
          
          # 5. Apply the SusFS-KSU Bridge
          # We use -f to force it and ignore "already patched" errors
          cd KernelSU
          patch -p1 --forward < ../susfs_repo/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || echo "Bridge patch skipped"
          cd ..

          # 6. Apply Main Kernel SusFS Patches
          # We manually apply the patches to the specific files Sultan uses
          # This bypasses the "Hunk Failed" errors by targeting the files directly
          patch -p1 < susfs_repo/kernel_patches/50_add_susfs_in_kernel-6.1.patch || echo "Main patch had conflicts, forcing manual header injection..."
          
          # 7. Manual Header Injection (The fail-safe)
          # If the patches above failed, this ensures the kernel at least knows SusFS exists
          sed -i '/#include <linux\/sched.h>/a #include <linux/susfs.h>' fs/open.c
          sed -i '/#include <linux\/sched.h>/a #include <linux/susfs.h>' fs/stat.c
          
          # 8. Hook SukiSU into the Build System
          echo "obj-y += KernelSU/" >> Makefile
          echo "source \"KernelSU/Kconfig\"" >> Kconfig
      - name: Inject Configuration
        run: |
          cat <<EOF >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_SUSFS_SUS_PATH=y
          CONFIG_SUSFS_SUS_MOUNT=y
          CONFIG_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          EOF

      - name: Build Kernel
        run: |
          mkdir -p out
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 gki_defconfig
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

      - name: Repack init_boot.img
        run: |
          # 1. Download magiskboot
          mkdir -p work && cd work
          wget https://github.com/TC7331/magiskboot-binaries/raw/main/x86_64/magiskboot
          chmod +x magiskboot
          
          # 2. Use the stock init_boot.img from your repo
          cp ../init_boot.img .
          
          # 3. Unpack the stock image
          ./magiskboot unpack init_boot.img
          
          # 4. Replace the stock kernel with your newly built Sultan kernel
          # Note: We rename the built Image to 'kernel' which is what magiskboot expects
          cp ../out/arch/arm64/boot/Image kernel
          
          # 5. Repack the image
          ./magiskboot repack init_boot.img sultan_init_boot.img
          
          # 6. Clean up
          mv sultan_init_boot.img ../Sultan-P9PXL-init_boot.img

      - name: Upload Flashable Image
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pixel9-Custom-Image
          path: Sultan-P9PXL-init_boot.img
