name: Build Pixel 9 Pro XL Kernel (SukiSU)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        path: kernel

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

    - name: Download Clang Toolchain
      run: |
        mkdir clang
        cd clang
        # Downloading a compatible Proton Clang (often used for Pixel kernels). 
        # You can swap this for Google's prebuilt clang if preferred.
        wget https://github.com/kdrag0n/proton-clang/releases/download/20230501/proton_clang-13.0-20230501.tar.zst
        tar -I zstd -xf proton_clang-13.0-20230501.tar.zst
        cd ..

    - name: Integrate SukiSU
      run: |
        cd kernel
        # Run the SukiSU setup script for GKI (main branch)
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        
        # Verify integration
        ls -d drivers/kernelsu

    - name: Build Kernel
      run: |
        cd kernel
        
        # Set environment variables for the build
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        # 1. Clean build
        make mrproper
        
        # 2. Configure for Pixel 9 Pro XL (Zuma Pro)
        # Using zumapro_defconfig as identified in your file list
        make zumapro_defconfig
        
        # 3. Enable KernelSU in the config
        # We append the config directly to .config to ensure it's enabled
        echo "CONFIG_KSU=y" >> .config
        # Ensure manual hook is disabled for GKI kprobe method
        # sed -i '/CONFIG_KSU_MANUAL_HOOK/d' .config
        
        # Re-sync config
        make olddefconfig

        # 4. Compile
        # Adjust -j$(nproc) to use available CPU cores
        make -j$(nproc) Image.lz4

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.lz4
        path: kernel/arch/arm64/boot/Image.lz4
