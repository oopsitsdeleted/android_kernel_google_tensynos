name: Build Sultan Kernel with SukiSU
on:
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git glibc-source libssl-dev libelf-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi python3 cpio

      - name: Set up Toolchain (Clang)
        run: |
          mkdir -p toolchain
          cd toolchain
          # Fetch AOSP Clang (Adjust version if Sultan kernel requires a specific rXXX version)
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487705.tar.gz
          tar -xf clang-r487705.tar.gz
          cd ..

      - name: Integrate SukiSU
        run: |
          # Using the GKI kprobe method as per your instructions
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # Force enable KPROBES and SukiSU in the defconfig
          # Note: Replace 'gki_defconfig' with the actual Sultan defconfig name if different
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/gki_defconfig

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Build command
          make O=out CC=clang arch/arm64/configs/gki_defconfig
          make -j$(nproc --all) O=out CC=clang \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      Image

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          # Simple adjustment for Pixel 9 Pro XL (GKI)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=komodo/g' anykernel.sh
          zip -r ../Sultan-SukiSU-Komodo.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-SukiSU-Kernel
          path: Sultan-SukiSU-Komodo.zip
