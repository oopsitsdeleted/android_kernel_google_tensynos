name: Sultan-SukiSU-Integrated
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      codename:
        description: 'Device Codename (e.g., zumapro)'
        required: true
        default: 'zumapro'
      android_version:
        description: 'Android Version'
        required: true
        default: '16'
      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.1'

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forked Kernel Source
        uses: actions/checkout@v4
        with:
          # This pulls the code from the repo where the workflow is running
          fetch-depth: 0

      - name: Download GCC 14.2.0 Toolchain
        run: |
          wget https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          tar -xf x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          echo "TOOLCHAIN_PATH=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin" >> $GITHUB_ENV

      - name: Clone AnyKernel3
        run: |
          # Matches Sultan's AnyKernel3 branch for your device
          git clone https://github.com/TheWildJames/AnyKernel3.git -b sultan-${{ github.event.inputs.codename }} AnyKernel3

      - name: Integrate SukiSU (with Built-in SUSFS)
        run: |
          echo "Running SukiSU-Ultra setup with SUSFS support..."
          # The 'susfs-main' argument tells the script to handle SUSFS patching automatically
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main

      - name: Configure Defconfig
        run: |
          DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.codename }}_defconfig"
          
          echo "Enabling SukiSU and SUSFS configurations..."
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_SUSFS=y"
            echo "CONFIG_TMPFS_XATTR=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_IP_NF_TARGET_TTL=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_NET_SCH_FQ=y"
          } >> $DEFCONFIG
          
          # Update Localversion for identification
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-Sultan-SukiSU"/' $DEFCONFIG

      - name: Build the Kernel
        run: |
          export PATH=$TOOLCHAIN_PATH:$PATH
          
          # Clean build environment
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux- CC=aarch64-linux-gcc -j$(nproc --all) clean
          
          # Generate config and build
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux- CC=aarch64-linux-gcc -j$(nproc --all) ${{ github.event.inputs.codename }}_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux- CC=aarch64-linux-gcc -j$(nproc --all)

      - name: Prepare AnyKernel3 Package
        run: |
          # Pixel 9 Pro XL (zumapro) build artifact location
          cp arch/arm64/boot/Image.lz4 AnyKernel3/Image.lz4 || cp arch/arm64/boot/Image AnyKernel3/Image
          
          # DTB Concatenation for Tensor G4
          if [ -d "out/google-devices/zumapro/dts" ]; then
            cat out/google-devices/zumapro/dts/*.dtb > AnyKernel3/dtb
          else
            # Fallback for standard kernel build paths
            find . -name "*.dtb" -exec cat {} + > AnyKernel3/dtb || echo "No DTBs found"
          fi

      - name: Upload Kernel ZIP
        run: |
          cd AnyKernel3
          ZIP_NAME="Sultan-SukiSU-${{ github.event.inputs.codename }}-A16.zip"
          zip -r "../$ZIP_NAME" ./*
          echo "ZIP_PATH=$GITHUB_WORKSPACE/$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-SukiSU-${{ github.event.inputs.codename }}
          path: ${{ env.ZIP_PATH }}
