name: Build Pixel 9 Pro XL Kernel

on:
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git python3 \
          libssl-dev libelf-dev libxml2-utils zip curl lz4

      - name: Setup Build Environment (Fake Kleaf)
        run: |
          cd kernel
          # Create the missing tools/bazel link we discussed
          mkdir -p tools
          # Since we aren't doing a full repo sync, we point to a custom toolchain
          # This is a simplified wrapper for Sultan's specific tree
          echo '#!/bin/bash' > tools/bazel
          echo 'exec build/kernel/kleaf/bazel.sh "$@"' >> tools/bazel
          chmod +x tools/bazel

      - name: Download Toolchains
        run: |
          # You need the Android Clang toolchain. 
          # Sultan's tree usually expects it in a specific relative path.
          mkdir -p prebuilts/clang/host/linux-x86
          # Example: Downloading a compatible Clang (r487747 is common for Tensor G4)
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz
          tar -xzf clang-r487747c.tar.gz -C prebuilts/clang/host/linux-x86/clang-r487747c

      - name: Build Kernel
        run: |
          cd kernel
          chmod +x build_caimito.sh
          # --lto=thin is essential for GitHub Actions to avoid OOM (Out of Memory)
          ./build_caimito.sh --lto=thin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-9-Pro-XL-Kernel
          path: |
            kernel/out/caimito/dist/boot.img
            kernel/out/caimito/dist/vendor_kernel_boot.img
            kernel/out/caimito/dist/dtbo.img
