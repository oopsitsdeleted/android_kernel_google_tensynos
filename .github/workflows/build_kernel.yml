name: Build Sultan Kernel with SukiSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev binutils-dev \
          python3-pip jq curl wget git lz4 zip

      - name: Create Missing Bazel Wrapper
        run: |
          # The script google-devices/zumapro/build_zumapro.sh expects tools/bazel
          # We create the directory and download the official Bazel wrapper
          mkdir -p tools
          curl -Lo tools/bazel https://raw.githubusercontent.com/bazelbuild/bazel/master/scripts/bazel
          chmod +x tools/bazel

      - name: Integrate SukiSU-Ultra
        run: |
          # Apply SukiSU hooks to the root Makefile and arch directories
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # Inject SukiSU configs into the correct ZumaPro defconfig fragment
          DEFCONFIG="google-devices/zumapro/zumapro_defconfig"
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"
          echo "# CONFIG_KSU_MANUAL_HOOK is not set" >> "$DEFCONFIG"

      - name: Build Kernel (ZumaPro)
        run: |
          # Set execution bit for the Sultan build script
          chmod +x google-devices/zumapro/build_zumapro.sh
          
          # Run from root so the script finds the 'tools/bazel' we created
          ./google-devices/zumapro/build_zumapro.sh

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          
          # Find the Image.lz4 artifact generated by the Bazel build
          IMAGE=$(find . -name "Image.lz4" | head -n 1)
          
          if [ -z "$IMAGE" ]; then
            echo "Error: Image.lz4 not found. Build likely failed."
            exit 1
          fi
          
          cp "$IMAGE" AnyKernel3/
          
          # Set device name to 'komodo' (Pixel 9 Pro XL)
          sed -i 's/device.name1=.*/device.name1=komodo/' AnyKernel3/anykernel.sh
          
          cd AnyKernel3 && zip -r9 ../Sultan-SukiSU-Komodo.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-SukiSU-Kernel-Zip
          path: Sultan-SukiSU-Komodo.zip
