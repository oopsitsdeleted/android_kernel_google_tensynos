name: Build Pixel 9 Pro XL Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup Clang r510928
        run: |
          mkdir -p prebuilts/clang/host/linux-x86/clang-r510928
          # Download the specific Clang version from Android Gitiles
          curl -Lo clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r33/clang-r510928.tar.gz
          tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r510928
          rm clang.tar.gz
          # Export path for standard scripts
          echo "$(pwd)/prebuilts/clang/host/linux-x86/clang-r510928/bin" >> $GITHUB_PATH
          
      - name: Install Bazel (Bazelisk)
        run: |
          # Download Bazelisk
          curl -Lo bazelisk https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x bazelisk
          # Use sudo to move it to a system path
          sudo mv bazelisk /usr/local/bin/bazel
          
          # Verify installation
          bazel --version

      - name: Build Caimito (Pixel 9 Pro XL)
        run: |
          # Use the script from your uploaded files
          # We pass the Clang path via Bazel flag if the workspace doesn't auto-detect
          ./build_caimito.sh --clang_version=r510928
