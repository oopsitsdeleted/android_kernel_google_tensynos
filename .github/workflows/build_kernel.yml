name: Build Sultan Kernel with SukiSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev binutils-dev \
          python3-pip jq curl wget git lz4 zip

      - name: Setup Kleaf Bazel Wrapper
        run: |
          # Create the tools directory and fetch a valid Bazel wrapper
          # build_zumapro.sh explicitly calls tools/bazel
          mkdir -p tools
          curl -fLo tools/bazel https://raw.githubusercontent.com/bazelbuild/bazel/master/scripts/packages/fedora/bazel
          chmod +x tools/bazel

      - name: Integrate SukiSU-Ultra
        run: |
          # Apply SukiSU hooks to the root Makefile
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # Configure Kprobes in the ZumaPro fragment
          DEFCONFIG="google-devices/zumapro/zumapro_defconfig"
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"
          echo "# CONFIG_KSU_MANUAL_HOOK is not set" >> "$DEFCONFIG"

      - name: Build Kernel (ZumaPro/Caimito)
        run: |
          chmod +x google-devices/zumapro/build_zumapro.sh
          
          # BUILD_AOSP_KERNEL=1 ensures we build from local source instead of prebuilts
          export BUILD_AOSP_KERNEL=1
          ./google-devices/zumapro/build_zumapro.sh

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          
          # For v5.15+ (Pixel 9), images are in out/DEVICE/dist
          # We check the caimito and zumapro output paths
          IMAGE=$(find out/ -name "Image.lz4" | head -n 1)
          
          if [ -z "$IMAGE" ]; then
            echo "Error: Image.lz4 not found. Checking root-level dist..."
            IMAGE=$(find dist/ -name "Image.lz4" | head -n 1)
          fi
          
          if [ -z "$IMAGE" ]; then
            echo "Error: Build artifact not found."
            exit 1
          fi
          
          cp "$IMAGE" AnyKernel3/
          
          # Device name for Pixel 9 Pro XL is 'komodo'
          sed -i 's/device.name1=.*/device.name1=komodo/' AnyKernel3/anykernel.sh
          
          cd AnyKernel3 && zip -r9 ../Sultan-SukiSU-Komodo.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-SukiSU-Kernel-Zip
          path: Sultan-SukiSU-Komodo.zip
