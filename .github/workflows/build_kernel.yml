name: Build Sultan Kernel with SukiSU for Pixel 9 Pro XL

on:
  workflow_dispatch:
    inputs:
      hook_method:
        description: 'Hook method to use'
        required: true
        default: 'kprobe'
        type: choice
        options:
          - kprobe
          - manual
          - tracepoint
      sukisu_branch:
        description: 'SukiSU branch (main/test/nongki/susfs-main/susfs-test)'
        required: true
        default: 'main'
        type: string
      build_variant:
        description: 'Build variant'
        required: true
        default: 'user'
        type: choice
        options:
          - user
          - userdebug
          - eng
  push:
    branches:
      - main
      - 16.0.0-sultan
    paths:
      - '.github/workflows/build-sukisu-sultan.yml'

jobs:
  build:
    name: Build Kernel with SukiSU
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Sultan Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Set up environment
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
          echo "KERNEL_VERSION=16.0.0-sultan-sukisu" >> $GITHUB_ENV
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python-is-python3 \
            libelf-dev \
            kmod \
            cpio
      
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sultan-kernel-pixel9-sukisu
          max-size: 8G
      
      - name: Download and setup Clang toolchain
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          
          # Download prebuilt Clang (Android's official toolchain)
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          
          # Set up paths
          echo "CLANG_PATH=$HOME/toolchains/clang/clang-r498229b/bin" >> $GITHUB_ENV
          echo "$HOME/toolchains/clang/clang-r498229b/bin" >> $GITHUB_PATH
      
      - name: Integrate SukiSU into kernel source
        run: |
          cd $GITHUB_WORKSPACE
          
          # Determine the setup command based on branch input
          SUKISU_BRANCH="${{ github.event.inputs.sukisu_branch || 'main' }}"
          
          echo "Integrating SukiSU with branch: $SUKISU_BRANCH"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s $SUKISU_BRANCH
          
      - name: Configure kernel for SukiSU
        run: |
          cd $GITHUB_WORKSPACE
          
          HOOK_METHOD="${{ github.event.inputs.hook_method || 'kprobe' }}"
          
          # Enable KernelSU/SukiSU config
          if [ -f "KernelSU/kernel/Kconfig" ]; then
            echo "CONFIG_KSU=y" >> arch/arm64/configs/cloudripper_gki_defconfig
          fi
          
          # Configure hook method
          case "$HOOK_METHOD" in
            kprobe)
              echo "Configuring KPROBES hook method"
              echo "CONFIG_KPROBES=y" >> arch/arm64/configs/cloudripper_gki_defconfig
              echo "# CONFIG_KSU_MANUAL_HOOK is not set" >> arch/arm64/configs/cloudripper_gki_defconfig
              echo "# CONFIG_KSU_TRACEPOINT_HOOK is not set" >> arch/arm64/configs/cloudripper_gki_defconfig
              ;;
            manual)
              echo "Configuring manual hook method"
              echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/cloudripper_gki_defconfig
              echo "# CONFIG_KSU_TRACEPOINT_HOOK is not set" >> arch/arm64/configs/cloudripper_gki_defconfig
              ;;
            tracepoint)
              echo "Configuring tracepoint hook method"
              echo "CONFIG_KSU_TRACEPOINT_HOOK=y" >> arch/arm64/configs/cloudripper_gki_defconfig
              echo "# CONFIG_KSU_MANUAL_HOOK is not set" >> arch/arm64/configs/cloudripper_gki_defconfig
              ;;
          esac
          
      - name: Build kernel
        run: |
          cd $GITHUB_WORKSPACE
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC="${CLANG_PATH}/clang"
          export LD="${CLANG_PATH}/ld.lld"
          export AR="${CLANG_PATH}/llvm-ar"
          export NM="${CLANG_PATH}/llvm-nm"
          export OBJCOPY="${CLANG_PATH}/llvm-objcopy"
          export OBJDUMP="${CLANG_PATH}/llvm-objdump"
          export READELF="${CLANG_PATH}/llvm-readelf"
          export STRIP="${CLANG_PATH}/llvm-strip"
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          
          # Use cloudripper defconfig for Pixel 9 Pro XL
          make O=out LLVM=1 LLVM_IAS=1 cloudripper_gki_defconfig
          
          # Build kernel
          make -j$(nproc) O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.lz4 dtbo.img
          
      - name: Prepare artifacts
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p artifacts
          
          # Copy kernel image
          if [ -f "out/arch/arm64/boot/Image.lz4" ]; then
            cp out/arch/arm64/boot/Image.lz4 artifacts/
            echo "Kernel image copied successfully"
          else
            echo "Error: Kernel image not found"
            exit 1
          fi
          
          # Copy dtbo.img if exists
          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            cp out/arch/arm64/boot/dtbo.img artifacts/
          fi
          
          # Copy modules
          find out -name "*.ko" -exec cp {} artifacts/ \;
          
          # Create build info
          cat > artifacts/build-info.txt << EOF
          Build Date: $(date)
          Kernel Version: $KERNEL_VERSION
          Device: Pixel 9 Pro XL (cloudripper)
          SukiSU Branch: ${{ github.event.inputs.sukisu_branch || 'main' }}
          Hook Method: ${{ github.event.inputs.hook_method || 'kprobe' }}
          Build Variant: ${{ github.event.inputs.build_variant || 'user' }}
          Commit: ${{ github.sha }}
          EOF
          
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sultan-sukisu-kernel-pixel9proxl-${{ env.BUILD_DATE }}
          path: artifacts/
          retention-days: 30
          
      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: sultan-sukisu-${{ env.BUILD_DATE }}
          name: Sultan Kernel with SukiSU - Pixel 9 Pro XL (${{ env.BUILD_DATE }})
          body: |
            ## Sultan Kernel with SukiSU Integration
            
            **Device:** Pixel 9 Pro XL (cloudripper)
            **Kernel Version:** ${{ env.KERNEL_VERSION }}
            **Build Date:** ${{ env.BUILD_DATE }}
            **SukiSU Branch:** ${{ github.event.inputs.sukisu_branch || 'main' }}
            **Hook Method:** ${{ github.event.inputs.hook_method || 'kprobe' }}
            **Build Variant:** ${{ github.event.inputs.build_variant || 'user' }}
            
            ### Files Included
            - `Image.lz4` - Kernel image
            - `dtbo.img` - Device tree overlay image (if applicable)
            - `*.ko` - Kernel modules
            - `build-info.txt` - Build information
            
            ### Installation
            1. Flash using a custom recovery or fastboot
            2. Boot into the new kernel
            3. Install SukiSU manager app
            
            ### Notes
            - Make sure to backup your current boot image before flashing
            - This is an unofficial build
            
            **Commit:** ${{ github.sha }}
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
