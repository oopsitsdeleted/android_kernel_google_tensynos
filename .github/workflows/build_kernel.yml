name: Build Sultan Kernel + SukiSU (GCC 14.2)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sultan Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev python3 cpio wget tar xz-utils

      - name: Download GCC 14.2 Toolchain
        run: |
          mkdir -p toolchain
          # Fetching official ARM GNU toolchain (aarch64-none-linux-gnu)
          wget https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -C toolchain --strip-components=1

      - name: Integrate SukiSU
        run: |
          # Integrate SukiSU source
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # Configure SukiSU & Kprobes
          # Note: If Sultan uses a custom defconfig name, change 'gki_defconfig' below
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          
          # Enable LTO (GCC specific)
          echo "CONFIG_LTO_GCC=y" >> $DEFCONFIG

      - name: Build Kernel with GCC 14.2 & LTO
        run: |
          export PATH=$(pwd)/toolchain/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-none-linux-gnu-
          
          # Sultan kernels usually handle the specific GCC/LTO optimizations in the Makefile, 
          # but we ensure the environment is clean and pointed to our downloaded GCC.
          make O=out gki_defconfig
          
          # Build the kernel image (Pixel 9 Pro XL typically uses Image.lz4)
          make -j$(nproc --all) O=out \
                      CROSS_COMPILE=aarch64-none-linux-gnu- \
                      AR=aarch64-none-linux-gnu-gcc-ar \
                      NM=aarch64-none-linux-gnu-gcc-nm \
                      RANLIB=aarch64-none-linux-gnu-gcc-ranlib \
                      Image.lz4

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.lz4 AnyKernel3/
          cd AnyKernel3
          # Set device properties for Komodo (Pixel 9 Pro XL)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=komodo/g' anykernel.sh
          zip -r ../Sultan-SukiSU-Komodo-GCC14.zip *

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-SukiSU-GCC14-Komodo
          path: Sultan-SukiSU-Komodo-GCC14.zip
