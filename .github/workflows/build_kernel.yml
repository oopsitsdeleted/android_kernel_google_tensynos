name: Build Sultan Pixel 9 Pro XL
on:
  workflow_dispatch:

# This ensures all 'run' commands start inside your kernel folder
defaults:
  run:
    working-directory: android_kernel_google_tensynos-16.0.0-sultan

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # Use libncurses-dev as libncurses5 is deprecated in Ubuntu 24.04
          sudo apt-get install -y bc bison build-essential flex git python3 \
          libssl-dev libelf-dev libxml2-utils zip curl lz4 libncurses-dev

      - name: Download Clang r510928
        run: |
          mkdir -p prebuilts/clang/host/linux-x86/clang-r510928
          curl -Lo clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r33/clang-r510928.tar.gz
          tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r510928
          rm clang.tar.gz

      - name: Setup Bazel Wrapper
        run: |
          mkdir -p tools
          # Link the Kleaf bazel script to the tools directory
          ln -sf ../build/kernel/kleaf/bazel.sh tools/bazel
          chmod +x build/kernel/kleaf/bazel.sh

      - name: Build Caimito (Pixel 9 Pro XL)
        run: |
          # Per your directory layout, the script is in google-devices/caimito/
          cd google-devices/caimito
          chmod +x build_caimito.sh
          # Run with thin LTO to ensure the 7GB RAM limit isn't hit
          ./build_caimito.sh --lto=thin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pixel9ProXL-Kernel
          # Note: 'out' is generated at the root of the kernel tree
          path: |
            android_kernel_google_tensynos-16.0.0-sultan/out/caimito/dist/boot.img
            android_kernel_google_tensynos-16.0.0-sultan/out/caimito/dist/dtbo.img
