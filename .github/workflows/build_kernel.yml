name: Build Sultan Kernel with SukiSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev binutils-dev \
          python3-pip jq curl wget git lz4 zip apt-transport-https gnupg

      - name: Install Host Bazel
        run: |
          # Official Bazel installation as recommended by Kleaf docs
          curl -fsSL https://bazel.build/bazel-release.pub.gpg | gpg --dearmor > bazel-archive-keyring.gpg
          sudo install -m 0755 bazel-archive-keyring.gpg /usr/share/keyrings/bazel-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/bazel-archive-keyring.gpg] https://storage.googleapis.com/bazel-apt stable jdk1.8" | sudo tee /etc/apt/sources.list.d/bazel.list
          sudo apt update && sudo apt install bazel -y

      - name: Integrate SukiSU-Ultra
        run: |
          # Apply SukiSU hooks to the source tree
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # Inject SukiSU-required configs into the ZumaPro defconfig fragment
          DEFCONFIG="google-devices/zumapro/zumapro_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"
            echo "# CONFIG_KSU_MANUAL_HOOK is not set" >> "$DEFCONFIG"
          else
            echo "ERROR: Defconfig not found at $DEFCONFIG"
            exit 1
          fi

      - name: Build Kernel (Direct Kleaf Call)
        run: |
          # Option 1: Calling bazel directly as per Kleaf documentation.
          # We use the targets found in your build_zumapro.sh but via host bazel.
          bazel run --config=stamp --config=zumapro //private/devices/google/zumapro:dist

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          
          # Bazel places output in out/zumapro/dist or out/caimito/dist
          IMAGE=$(find out/ -name "Image.lz4" | head -n 1)
          
          if [ -z "$IMAGE" ]; then
            echo "Image not found in 'out/', checking root 'dist/'..."
            IMAGE=$(find dist/ -name "Image.lz4" | head -n 1)
          fi
          
          if [ -z "$IMAGE" ]; then
            echo "Error: Image.lz4 could not be located. Build failed."
            exit 1
          fi
          
          cp "$IMAGE" AnyKernel3/
          
          # Set device codename to 'komodo' (Pixel 9 Pro XL)
          sed -i 's/device.name1=.*/device.name1=komodo/' AnyKernel3/anykernel.sh
          
          cd AnyKernel3 && zip -r9 ../Sultan-SukiSU-Komodo.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-SukiSU-Kernel-Zip
          path: Sultan-SukiSU-Komodo.zip
